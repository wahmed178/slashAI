<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>SlashAI</title>
    <link rel="icon" href="/favicon.png" />
  </head>
  <body>
    <!--
      Dev-only SPA shell.

      `vite dev` runs with appType "spa" and TanStack Start's SSR middleware
      disabled (see vite.config.ts), so Vite serves this file and src/client.tsx
      mounts the app with createRoot into `document.body` - there is no
      server-rendered markup to hydrate.

      This file is only used by the dev server. `vite build` still goes through
      TanStack Start + Nitro, and scripts/build-for-freebuff.sh writes its own
      dist/index.html for the static deploy.
    -->
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
