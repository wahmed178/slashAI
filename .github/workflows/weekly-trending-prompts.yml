name: Weekly Trending Prompts
on:
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run fetch script
        run: node scripts/fetch-trending-prompts.cjs
      - name: Commit and push
        run: |
          git config user.name "SlashAI Bot"
          git config user.email "bot@slashai.app"
          git add src/data/trending-prompts.json
          git diff --staged --quiet || git commit -m "chore(data): trending prompts $(date +%Y-%m-%d)"
          git push
