name: Weekly Trending Prompts

# Refreshes the trending prompt picks.
# The `permissions` block is required: this repo's default GITHUB_TOKEN is
# read-only, so without it the commit step cannot push and the job fails.
on:
  schedule:
    # Wednesdays 06:00 UTC
    - cron: '0 6 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fetch script
        run: node scripts/fetch-trending-prompts.cjs

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "SlashAI Bot"
          git config user.email "bot@slashai.app"
          git add src/data/trending-prompts.json
          if git diff --staged --quiet; then
            echo "No change this week - nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): trending prompts $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
