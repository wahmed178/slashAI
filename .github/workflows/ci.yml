name: CI

# Runs on every pull request and on main, so a red PR can never be merged
# blindly. Deliberately lightweight: no secrets, no Android SDK, no deploy —
# just "does it typecheck" and "is the catalogue still clean".
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & validate catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the command catalogue
        run: bun run catalog:validate

      - name: Typecheck
        run: bun tsc -b --noEmit
