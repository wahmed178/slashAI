name: Daily Content Update

# Quote of the day, an advice slip and a museum artwork.
# The `permissions` block is required: this repo's default GITHUB_TOKEN is
# read-only, so without it the commit step cannot push and the job fails.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Every data-refresh workflow shares one group so they never race each other
# on push. cancel-in-progress stays false: a queued update should still land.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch daily content
        run: node scripts/fetch-daily-content.cjs

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "SlashAI Bot"
          git config user.email "bot@slashai.app"
          git add src/data/daily-content.json
          if git diff --staged --quiet; then
            echo "No change today - nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): daily content $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
