name: Daily Deals Update
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch deals
        run: node scripts/fetch-deals.cjs
      - name: Commit and push
        run: |
          git config user.name "SlashAI Bot"
          git config user.email "bot@slashai.app"
          git add src/data/products.json
          git diff --staged --quiet || git commit -m "chore(data): daily deals $(date +%Y-%m-%d)"
          git push
