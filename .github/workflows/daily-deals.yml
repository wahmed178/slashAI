name: Daily Deals Update

# Free offers and discounts collected from public deal feeds.
# The `permissions` block is required: this repo's default GITHUB_TOKEN is
# read-only, so without it the commit step cannot push and the job fails.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch deals
        run: node scripts/fetch-deals.cjs

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "SlashAI Bot"
          git config user.email "bot@slashai.app"
          git add src/data/products.json
          if git diff --staged --quiet; then
            echo "No change today - nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): daily deals $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
