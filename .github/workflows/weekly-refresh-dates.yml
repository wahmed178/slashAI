name: Weekly Resource Date Refresh

on:
  schedule:
    # Mondays 04:00 UTC - keeps "Last checked" dates current every week
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh resource dates
        run: node scripts/refresh-resource-dates.cjs
      - name: Commit and push
        run: |
          git config user.name "SlashAI Bot"
          git config user.email "bot@slashai.app"
          git add src/lib/
          git diff --staged --quiet || git commit -m "chore(data): refresh resource check dates $(date +%Y-%m-%d)"
          git push
